<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博博客 · 极客下载站 · 动态版</title>
    <!-- 科技感字体 & 图标库 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Markdown 解析器 (用于扩展阅读) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* 样式完全不变，保持之前的高科技风格 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0a0c12;
            font-family: 'Inter', sans-serif;
            color: #e0f0ff;
            line-height: 1.6;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 180, 255, 0.08), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .wrapper {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            backdrop-filter: blur(1px);
        }
        .hero {
            background: rgba(15, 25, 35, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.25);
            border-radius: 32px;
            padding: 2.5rem 2rem;
            margin-bottom: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 255, 255, 0.2) inset, 0 0 30px rgba(0, 180, 255, 0.3);
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .avatar {
            width: 110px;
            height: 110px;
            background: linear-gradient(145deg, #00ccff, #a020f0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            color: #0a0c12;
            box-shadow: 0 0 30px #00ffffaa, 0 0 10px #8a2be2 inset;
            border: 2px solid #b0f0ff;
        }
        .hero-text h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #a0f0ff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px #00ccff;
        }
        .hero-tagline {
            font-size: 1.2rem;
            display: flex;
            gap: 1.2rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
            color: #bbf0ff;
            font-family: 'Space Mono', monospace;
        }
        .hero-tagline span {
            border-right: 2px solid #0ff;
            padding-right: 1.2rem;
            opacity: 0.9;
        }
        .hero-tagline span:last-child {
            border-right: none;
        }
        .section-title {
            font-size: 2rem;
            font-weight: 600;
            margin: 2.5rem 0 1.8rem 0;
            display: inline-block;
            padding-bottom: 0.5rem;
            border-bottom: 3px solid #0ff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 8px cyan;
            position: relative;
        }
        .section-title::before {
            content: "///";
            margin-right: 12px;
            color: #0ff;
            font-weight: 400;
            opacity: 0.8;
        }
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.8rem;
            margin-bottom: 2rem;
        }
        .blog-card {
            background: rgba(10, 20, 28, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 24px;
            padding: 1.8rem 1.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }
        .blog-card:hover {
            transform: translateY(-6px);
            border-color: #0ff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4), 0 10px 25px -5px black;
        }
        .blog-card::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, #0ff, transparent);
            transition: left 0.6s;
        }
        .blog-card:hover::after {
            left: 100%;
        }
        .blog-date {
            font-family: 'Space Mono', monospace;
            color: #00e0ff;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .blog-date i {
            font-size: 0.8rem;
            color: #0ff;
        }
        .blog-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }
        .blog-excerpt {
            color: #aac8e0;
            margin: 1rem 0 1.5rem;
            font-size: 0.95rem;
        }
        .read-link {
            text-decoration: none;
            color: #0ff;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        .read-link:hover {
            border-bottom-color: #0ff;
        }
        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 2rem;
            margin-top: 1.5rem;
            margin-bottom: 3rem;
        }
        .download-card {
            background: rgba(8, 18, 28, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1.5px solid rgba(0, 255, 255, 0.3);
            border-radius: 28px;
            padding: 2rem 1.8rem;
            display: flex;
            flex-direction: column;
            transition: 0.2s;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        }
        .download-card:hover {
            border-color: #ff44e6;
            box-shadow: 0 0 30px #ff44e680, 0 0 10px #0ff;
        }
        .file-icon {
            font-size: 3.2rem;
            color: #0ff;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 8px cyan);
        }
        .file-name {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(145deg, #fff, #b0f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .file-meta {
            display: flex;
            justify-content: space-between;
            font-family: 'Space Mono', monospace;
            color: #6fd9ff;
            border-bottom: 1px dashed #1f4b66;
            padding-bottom: 0.8rem;
            margin: 1rem 0 1.5rem;
        }
        .file-meta span i {
            margin-right: 5px;
            color: #ffb86c;
        }
        .download-btn {
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 0.9rem 0;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: auto;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.3);
            background-color: rgba(0, 255, 255, 0.03);
            text-decoration: none;
        }
        .download-btn:hover {
            background: #0ff;
            color: #0a0c12;
            box-shadow: 0 0 35px cyan, 0 0 10px #0ff inset;
            border-color: #0ff;
        }
        .download-btn i {
            font-size: 1.2rem;
        }
        .footer {
            margin-top: 5rem;
            text-align: center;
            padding: 2rem 0 1rem;
            border-top: 1px solid rgba(0, 255, 255, 0.25);
            color: #5d9eb9;
            font-family: 'Space Mono', monospace;
            position: relative;
        }
        .footer::before {
            content: "";
            position: absolute;
            top: -2px; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #0ff, #ff44e6, #0ff, transparent);
            opacity: 0.6;
        }
        .glitch {
            color: #0ff;
            font-weight: 600;
            animation: glitch 3s infinite;
        }
        @keyframes glitch {
            0%,100% { opacity: 1; text-shadow: 0 0 5px #0ff, 0 0 15px #0ff; }
            33% { text-shadow: -2px 0 #ff44e6, 2px 2px #0ff; }
            66% { text-shadow: 2px -2px #0ff, -2px 2px #ff44e6; }
        }
        .loading {
            text-align: center;
            padding: 3rem;
            color: #0ff;
            font-size: 1.5rem;
            font-family: 'Space Mono', monospace;
        }
        .error-message {
            color: #ff88aa;
            padding: 2rem;
            text-align: center;
            border: 1px solid #ff44e6;
            border-radius: 24px;
            background: rgba(30, 0, 20, 0.5);
        }
        @media (max-width: 600px) {
            .hero {
                flex-direction: column;
                text-align: center;
                padding: 1.8rem;
            }
            .hero-text h1 {
                font-size: 2rem;
            }
            .hero-tagline {
                justify-content: center;
            }
            .section-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- 个人全息档案 (现在所有文本通过 text.json 填充) -->
        <header class="hero">
            <div class="avatar">
                <i class="fas fa-robot"></i>
            </div>
            <div class="hero-text">
                <h1 id="hero-name">TussalZeus18028</h1>  <!-- 原硬编码作为后备 -->
                <div class="hero-tagline">
                    <span id="tag1"><i class="fas fa-microchip"></i> AI Architect</span>
                    <span id="tag2"><i class="fas fa-cubes"></i> Quantum tinkerer</span>
                    <span id="tag3"><i class="fas fa-bolt"></i> CyberNomad</span>
                </div>
                <p id="hero-desc" style="color: #9fc9ff; max-width: 550px; margin-top: 0.8rem; border-left: 3px solid #0ff; padding-left: 1rem;">
                    解码未来 · 分享开源精神与深度思考。所有博客与下载均动态加载。
                </p>
            </div>
        </header>

        <!-- 博客文章区 (动态从 date/articles.json + .md 读取) -->
        <section>
            <h2 class="section-title">LATEST THOUGHTS</h2>
            <div id="blog-posts" class="blog-grid">
                <div class="loading"><i class="fas fa-spinner fa-pulse"></i> 正在链接神经网格...</div>
            </div>
        </section>

        <!-- 下载功能区 (动态从 download.json 读取) -->
        <section>
            <h2 class="section-title">NEURAL DOWNLOADS</h2>
            <div id="download-cards" class="download-grid">
                <div class="loading"><i class="fas fa-spinner fa-pulse"></i> 扫描量子仓库...</div>
            </div>
        </section>

        <!-- 页脚装饰 (文本也通过 text.json 填充) -->
        <footer class="footer">
            <p id="footer-line1"><span class="glitch">[ root@nova-blog ]</span>  —  所有数据实时从 /date 和 /Files 读取  —  <i class="fas fa-satellite-dish"></i>  ORBIT 2026</p>
            <p id="footer-line2" style="margin-top: 0.5rem; font-size: 0.8rem;">🛸 需要维护 date/articles.json 与 download.json  |  文章卡片支持点击阅读全文 (实验性)</p>
        </footer>
    </div>

    <!-- 动态加载脚本 (增加 text.json 支持) -->
    <script>
        (function() {
            // 辅助函数：显示错误信息到容器
            function showError(containerId, message) {
                const container = document.getElementById(containerId);
                if (container) {
                    container.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-triangle"></i> ${message}</div>`;
                }
            }

            // ========== 1. 加载 text.json 填充静态文本 ==========
            async function loadTextConfig() {
                try {
                    const response = await fetch('date/text.json');
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} — 无法获取文本配置`);
                    }
                    const texts = await response.json();

                    // 替换名字
                    const nameEl = document.getElementById('hero-name');
                    if (nameEl && texts.name) nameEl.textContent = texts.name;

                    // 替换三个标签（注意标签内包含图标，所以要小心只替换文本节点）
                    // 简单方法：直接替换 span 的 innerHTML，保留图标
                    if (texts.tagline && Array.isArray(texts.tagline)) {
                        const tag1 = document.getElementById('tag1');
                        const tag2 = document.getElementById('tag2');
                        const tag3 = document.getElementById('tag3');
                        if (tag1 && texts.tagline[0]) tag1.innerHTML = `<i class="fas fa-microchip"></i> ${texts.tagline[0]}`;
                        if (tag2 && texts.tagline[1]) tag2.innerHTML = `<i class="fas fa-cubes"></i> ${texts.tagline[1]}`;
                        if (tag3 && texts.tagline[2]) tag3.innerHTML = `<i class="fas fa-bolt"></i> ${texts.tagline[2]}`;
                    }

                    // 替换描述
                    const descEl = document.getElementById('hero-desc');
                    if (descEl && texts.description) descEl.textContent = texts.description;

                    // 替换页脚第一行（注意保留 glitch 效果）
                    const footer1 = document.getElementById('footer-line1');
                    if (footer1 && texts.footer_line1) {
                        // 保留 <span class="glitch"> 结构
                        footer1.innerHTML = `<span class="glitch">${texts.footer_line1.split('—')[0]}</span> — ${texts.footer_line1.split('—')[1] || ''} <i class="fas fa-satellite-dish"></i> ${texts.footer_line1.split('—')[2] || ''}`;
                    }

                    // 替换页脚第二行
                    const footer2 = document.getElementById('footer-line2');
                    if (footer2 && texts.footer_line2) footer2.textContent = texts.footer_line2;

                } catch (err) {
                    console.warn('加载 text.json 失败，将使用默认文本。', err);
                    // 失败时保留原有硬编码文本，无需额外操作
                }
            }

            // ========== 2. 加载文章列表 ==========
            async function loadBlogPosts() {
                const blogContainer = document.getElementById('blog-posts');
                if (!blogContainer) return;

                try {
                    const response = await fetch('date/articles.json');
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} — 无法获取文章索引`);
                    }
                    const articles = await response.json();
                    
                    blogContainer.innerHTML = '';

                    if (!articles || articles.length === 0) {
                        blogContainer.innerHTML = '<div class="error-message">📭 暂未发现思想碎片 (articles.json为空)</div>';
                        return;
                    }

                    for (const article of articles) {
                        const card = document.createElement('article');
                        card.className = 'blog-card';

                        const dateDiv = document.createElement('div');
                        dateDiv.className = 'blog-date';
                        dateDiv.innerHTML = `<i class="far fa-calendar-alt"></i> ${article.date || '未知日期'} · <i class="fas fa-tag"></i> ${article.category || '未分类'}`;
                        
                        const titleH3 = document.createElement('h3');
                        titleH3.className = 'blog-title';
                        titleH3.textContent = article.title || '无标题';

                        const excerptP = document.createElement('p');
                        excerptP.className = 'blog-excerpt';
                        excerptP.textContent = article.excerpt || '这个大脑区块还没有写入摘要……';

                        const readLink = document.createElement('a');
                        readLink.className = 'read-link';
                        readLink.href = '#';
                        readLink.innerHTML = '读取更多 <i class="fas fa-arrow-right"></i>';
                        readLink.addEventListener('click', async function(e) {
                            e.preventDefault();
                            if (!article.filename) {
                                alert('未指定文章文件');
                                return;
                            }
                            try {
                                const mdResponse = await fetch(`date/${article.filename}`);
                                if (!mdResponse.ok) {
                                    alert(`无法读取文章: ${article.filename}`);
                                    return;
                                }
                                const mdText = await mdResponse.text();
                                const htmlContent = marked.parse(mdText);
                                const newWin = window.open('', '_blank');
                                newWin.document.write(`
                                    <html><head><title>${article.title}</title>
                                    <style>body { background:#0a0c12; color:#e0f0ff; font-family: 'Inter', sans-serif; padding: 2rem; }</style>
                                    <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">
                                    </head><body>${htmlContent}</body></html>
                                `);
                            } catch (err) {
                                alert('加载失败：' + err.message);
                            }
                        });

                        card.appendChild(dateDiv);
                        card.appendChild(titleH3);
                        card.appendChild(excerptP);
                        card.appendChild(readLink);

                        blogContainer.appendChild(card);
                    }
                } catch (err) {
                    console.error('博客加载错误:', err);
                    showError('blog-posts', `神经链接失败: ${err.message} — 请确认 date/articles.json 是否存在且格式正确。`);
                }
            }

            // ========== 3. 加载下载列表 ==========
            async function loadDownloads() {
                const downloadContainer = document.getElementById('download-cards');
                if (!downloadContainer) return;

                try {
                    const response = await fetch('download.json');
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} — 无法获取下载索引`);
                    }
                    const downloads = await response.json();

                    downloadContainer.innerHTML = '';

                    if (!downloads || downloads.length === 0) {
                        downloadContainer.innerHTML = '<div class="error-message">🔌 下载库为空 (download.json 无数据)</div>';
                        return;
                    }

                    for (const item of downloads) {
                        const card = document.createElement('div');
                        card.className = 'download-card';

                        const iconI = document.createElement('i');
                        iconI.className = `fas ${item.icon || 'fa-file'} file-icon`;
                        
                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'file-name';
                        nameDiv.textContent = item.name || item.filename;
                        
                        const metaDiv = document.createElement('div');
                        metaDiv.className = 'file-meta';
                        metaDiv.innerHTML = `<span><i class="fas fa-database"></i> ${item.size || '?'}</span><span><i class="fas fa-shield-alt"></i> 下载</span>`;
                        
                        const descP = document.createElement('p');
                        descP.style.marginBottom = '1.5rem';
                        descP.style.color = '#b0e0ff';
                        descP.style.fontSize = '0.95rem';
                        descP.textContent = item.description || '一个神秘的文件';

                        const btn = document.createElement('a');
                        btn.className = 'download-btn';
                        btn.href = `Files/${item.filename}`;
                        btn.setAttribute('download', '');
                        btn.innerHTML = '<i class="fas fa-download"></i> 获取文件';

                        card.appendChild(iconI);
                        card.appendChild(nameDiv);
                        card.appendChild(metaDiv);
                        card.appendChild(descP);
                        card.appendChild(btn);

                        downloadContainer.appendChild(card);
                    }
                } catch (err) {
                    console.error('下载加载错误:', err);
                    showError('download-cards', `量子仓库连接失败: ${err.message} — 请确认 download.json 是否存在且格式正确。`);
                }
            }

            // ========== 4. 初始化所有加载 ==========
            async function init() {
                // 先加载文本配置（无论成功与否都继续）
                await loadTextConfig();
                // 然后加载文章和下载（可并行）
                await Promise.all([loadBlogPosts(), loadDownloads()]);
            }

            init();

            console.log("%c🔥 动态博客已启动 · 所有静态文本来自 date/text.json 🔥", "color: #0ff; font-size: 16px; font-family: monospace; background: #0a0c12; padding: 4px; border: 1px solid cyan;");
        })();
    </script>

    <!-- 
        需要额外文件：
        - date/text.json       (页面静态文字配置)
        - date/articles.json   (文章索引)
        - date/xxx.md          (文章正文)
        - download.json        (下载项索引)
        - Files/xxx            实际下载文件
    -->
</body>
</html>
