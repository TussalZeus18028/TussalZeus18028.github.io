<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部文章 · 赛博博客</title>
    <!-- 字体 & 图标库 (与主页一致) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* ========== 全局高科技风格 (与主页完全一致) ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0c12;
            font-family: 'Inter', sans-serif;
            color: #e0f0ff;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 180, 255, 0.08), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .wrapper {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            backdrop-filter: blur(1px);
        }
        /* 返回链接 */
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #0ff;
            font-size: 1.2rem;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            font-family: 'Space Mono', monospace;
        }
        .back-link:hover { border-bottom-color: #0ff; }
        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #0ff, #ff44e6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-left: 6px solid #0ff;
            padding-left: 1.5rem;
        }
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.8rem;
            margin-bottom: 3rem;
        }
        .blog-card {
            background: rgba(10, 20, 28, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 24px;
            padding: 1.8rem 1.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
        }
        .blog-card:hover {
            transform: translateY(-6px);
            border-color: #0ff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.4);
        }
        .blog-card::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, #0ff, transparent);
            transition: left 0.6s;
        }
        .blog-card:hover::after { left: 100%; }
        .blog-date {
            font-family: 'Space Mono', monospace;
            color: #00e0ff;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
            display: flex;
            gap: 6px;
        }
        .blog-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(145deg, #fff, #b0f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .blog-excerpt {
            color: #aac8e0;
            margin: 1rem 0 1.5rem;
            font-size: 0.95rem;
        }
        .read-link {
            text-decoration: none;
            color: #0ff;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
            cursor: pointer;
        }
        .read-link:hover { border-bottom-color: #0ff; }
        .loading { text-align: center; padding: 3rem; color: #0ff; font-size: 1.5rem; font-family: 'Space Mono', monospace; }
        .error-message { color: #ff88aa; padding: 2rem; text-align: center; border: 1px solid #ff44e6; border-radius: 24px; background: rgba(30, 0, 20, 0.5); }
        .footer {
            margin-top: 4rem;
            text-align: center;
            padding: 2rem 0 1rem;
            border-top: 1px solid rgba(0, 255, 255, 0.25);
            color: #5d9eb9;
            font-family: 'Space Mono', monospace;
            position: relative;
        }
        .footer::before {
            content: "";
            position: absolute;
            top: -2px; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #0ff, #ff44e6, #0ff, transparent);
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回主站</a>
        <h1 class="page-title"><i class="fas fa-archive"></i> 全部文章 · 神经档案</h1>

        <div id="all-articles" class="blog-grid">
            <div class="loading"><i class="fas fa-spinner fa-pulse"></i> 加载思想矩阵...</div>
        </div>

        <footer class="footer">
            <p><span class="glitch">[ root@archive ]</span>  —  共 <span id="article-count">0</span> 篇深度思考</p>
        </footer>
    </div>

    <script>
        (async function() {
            const container = document.getElementById('all-articles');
            const countSpan = document.getElementById('article-count');
            try {
                const resp = await fetch('date/articles.json');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const articles = await resp.json();
                if (!articles || articles.length === 0) {
                    container.innerHTML = '<div class="error-message">📭 这里暂时一片空白</div>';
                    return;
                }
                countSpan.textContent = articles.length;
                container.innerHTML = ''; // 清空 loading

                for (const article of articles) {
                    const card = document.createElement('article');
                    card.className = 'blog-card';
                    card.innerHTML = `
                        <div class="blog-date"><i class="far fa-calendar-alt"></i> ${article.date || '未知'} · <i class="fas fa-tag"></i> ${article.category || '未分类'}</div>
                        <h3 class="blog-title">${article.title || '无标题'}</h3>
                        <p class="blog-excerpt">${article.excerpt || '……'}</p>
                        <a href="#" class="read-link" data-filename="${article.filename || ''}" data-title="${article.title || ''}">读取更多 <i class="fas fa-arrow-right"></i></a>
                    `;
                    container.appendChild(card);
                }

                // 绑定阅读事件（复用主页的高科技弹窗）
                document.querySelectorAll('.read-link').forEach(link => {
                    link.addEventListener('click', async (e) => {
                        e.preventDefault();
                        const filename = link.dataset.filename;
                        const title = link.dataset.title;
                        if (!filename) { alert('未指定文章文件'); return; }
                        try {
                            const mdResp = await fetch(`date/${filename}`);
                            if (!mdResp.ok) { alert('读取失败'); return; }
                            const mdText = await mdResp.text();
                            const html = marked.parse(mdText);
                            // 打开带科技装饰的新窗口
                            const win = window.open('', '_blank');
                            win.document.write(`
                                <!DOCTYPE html>
                                <html>
                                <head><meta charset="UTF-8"><title>${title} · 赛博阅读</title>
                                <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Mono&display=swap" rel="stylesheet">
                                <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
                                <style>
                                    * { margin:0; padding:0; box-sizing:border-box; }
                                    body { background:#0a0c12; color:#e0f0ff; font-family:'Inter',sans-serif; padding:2rem; position:relative; }
                                    body::before { content:""; position:fixed; top:0; left:0; width:100%; height:100%; background-image:linear-gradient(rgba(0,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,255,0.02) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; z-index:0; }
                                    .cyber-container { position:relative; z-index:2; max-width:900px; margin:0 auto; background:rgba(10,20,30,0.7); backdrop-filter:blur(12px); border:2px solid rgba(0,255,255,0.3); border-radius:32px; padding:2.5rem; box-shadow:0 0 40px rgba(0,255,255,0.2); }
                                    h1,h2,h3 { color:#a0f0ff; border-bottom:1px solid #0ff3; padding-bottom:0.5rem; margin:1.5rem 0 1rem; text-shadow:0 0 8px cyan; }
                                    p { margin:1.2rem 0; color:#cef0ff; }
                                    code { background:#1a2a3a; color:#ffb0e0; padding:0.2rem 0.5rem; border-radius:8px; font-family:'Space Mono',monospace; border:1px solid #0ff3; }
                                    pre { background:#0f1a24; padding:1.5rem; border-radius:20px; border:1px solid #0ff; overflow-x:auto; box-shadow:0 0 20px #0ff2; }
                                    .header-glow { text-align:center; margin-bottom:2rem; font-size:1.2rem; color:#0ff; font-family:'Space Mono',monospace; text-transform:uppercase; letter-spacing:4px; opacity:0.8; }
                                </style>
                                </head>
                                <body><div class="cyber-container"><div class="header-glow"><i class="fas fa-brain"></i> NEURAL INTERFACE <i class="fas fa-microchip"></i></div>${html}</div></body>
                                </html>
                            `);
                            win.document.close();
                        } catch (err) { alert('加载失败: ' + err.message); }
                    });
                });
            } catch (err) {
                container.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-triangle"></i> 神经链接失败: ${err.message}</div>`;
            }
        })();
    </script>
</body>
</html>
