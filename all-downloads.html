<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>全部下载 · 量子仓库 · 动态觉醒</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ========== 全局高科技风格 + 增强动效 ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0a0c12;
            font-family: 'Inter', sans-serif;
            color: #e0f0ff;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            cursor: default;
        }
        /* 动态流动网格背景 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            animation: driftGrid 20s linear infinite;
        }
        @keyframes driftGrid {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 180, 255, 0.08), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        /* 全局扫描光晕 */
        .global-scan {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(125deg, rgba(0,255,255,0) 0%, rgba(0,255,255,0.02) 40%, rgba(255,0,200,0.01) 100%);
            pointer-events: none;
            z-index: 1;
            animation: scanPulse 8s infinite alternate;
        }
        @keyframes scanPulse {
            0% { opacity: 0.2; }
            100% { opacity: 0.6; }
        }
        /* 鼠标跟随光晕 */
        .cursor-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.2) 0%, rgba(0, 255, 255, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: transform 0.05s linear;
            filter: blur(18px);
            opacity: 0.5;
        }
        .wrapper {
            position: relative;
            z-index: 2;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            backdrop-filter: blur(1px);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: #0ff;
            font-size: 1.2rem;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
            font-family: 'Space Mono', monospace;
        }
        .back-link:hover {
            border-bottom-color: #0ff;
            text-shadow: 0 0 8px cyan;
        }
        /* 页面标题 + 扫描线动效 */
        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #0ff, #ff44e6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-left: 6px solid #0ff;
            padding-left: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        .page-title::after {
            content: "";
            position: absolute;
            bottom: -5px;
            left: -100%;
            width: 80%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #0ff, #ff44e6, transparent);
            animation: titleSweep 3s infinite linear;
        }
        @keyframes titleSweep {
            0% { left: -100%; }
            100% { left: 120%; }
        }
        /* 下载网格布局 */
        .download-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.8rem;
            margin-bottom: 3rem;
        }
        /* 卡片通用样式 + 入场动画 */
        .download-card {
            background: rgba(10, 20, 28, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 24px;
            padding: 1.8rem 1.5rem;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(30px);
            animation: cardRise 0.5s ease forwards;
            animation-delay: calc(var(--order, 0) * 0.08s);
        }
        @keyframes cardRise {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .download-card::before {
            content: "";
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, cyan, magenta, cyan);
            border-radius: 26px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .download-card:hover::before {
            opacity: 0.25;
        }
        .download-card:hover {
            transform: translateY(-6px) scale(1.01);
            border-color: #0ff;
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.6);
        }
        .download-card::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 4px;
            background: linear-gradient(90deg, transparent, #0ff, transparent);
            transition: left 0.6s;
        }
        .download-card:hover::after {
            left: 100%;
        }
        .file-icon {
            font-size: 3.2rem;
            color: #0ff;
            margin-bottom: 1rem;
            filter: drop-shadow(0 0 8px cyan);
        }
        .file-name {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(145deg, #fff, #b0f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .file-meta {
            display: flex;
            justify-content: space-between;
            font-family: 'Space Mono', monospace;
            color: #6fd9ff;
            border-bottom: 1px dashed #1f4b66;
            padding-bottom: 0.8rem;
            margin: 1rem 0 1.5rem;
        }
        .download-btn {
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 0.9rem 0;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: auto;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.3);
            background-color: rgba(0, 255, 255, 0.03);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }
        .download-btn::before {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            border-radius: 50%;
            background: rgba(0, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }
        .download-btn:active::before {
            width: 280px;
            height: 280px;
            opacity: 0;
        }
        .download-btn:hover {
            background: #0ff;
            color: #0a0c12;
            box-shadow: 0 0 35px cyan;
            border-color: #0ff;
            transform: scale(1.02);
        }
        .loading {
            text-align: center;
            padding: 3rem;
            color: #0ff;
            font-size: 1.5rem;
            font-family: 'Space Mono', monospace;
        }
        .error-message {
            color: #ff88aa;
            padding: 2rem;
            text-align: center;
            border: 1px solid #ff44e6;
            border-radius: 24px;
            background: rgba(30, 0, 20, 0.5);
        }
        .footer {
            margin-top: 4rem;
            text-align: center;
            padding: 2rem 0 1rem;
            border-top: 1px solid rgba(0, 255, 255, 0.25);
            color: #5d9eb9;
            font-family: 'Space Mono', monospace;
            position: relative;
        }
        .footer::before {
            content: "";
            position: absolute;
            top: -2px; left: 0; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, #0ff, #ff44e6, #0ff, transparent);
            opacity: 0.6;
            animation: footerFlow 4s infinite alternate;
        }
        @keyframes footerFlow {
            0% { opacity: 0.2; background-position: -200px; }
            100% { opacity: 1; background-position: 200px; }
        }
        .glitch {
            color: #0ff;
            font-weight: 600;
            animation: glitch 3s infinite;
        }
        @keyframes glitch {
            0%,100% { opacity: 1; text-shadow: 0 0 5px #0ff, 0 0 15px #0ff; }
            33% { text-shadow: -2px 0 #ff44e6, 2px 2px #0ff; }
            66% { text-shadow: 2px -2px #0ff, -2px 2px #ff44e6; }
        }
        ::-webkit-scrollbar { width: 8px; background: #0a0c12; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(#0ff, #ff44e6); border-radius: 10px; }
        @media (max-width: 600px) {
            .cursor-glow { display: none; }
            .page-title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="global-scan"></div>
    <div class="cursor-glow" id="cursorGlow"></div>

    <div class="wrapper">
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> 返回主站</a>
        <h1 class="page-title"><i class="fas fa-database"></i> 全部下载 · 量子仓库</h1>

        <div id="all-downloads" class="download-grid">
            <div class="loading"><i class="fas fa-spinner fa-pulse"></i> 扫描文件系统...</div>
        </div>

        <footer class="footer">
            <p><span class="glitch">[ root@repository ]</span>  —  [共 <span id="download-count">0</span> 个文件]</p>
        </footer>
    </div>

    <script>
        (function() {
            // 鼠标跟随光晕
            const glow = document.getElementById('cursorGlow');
            if (glow && window.innerWidth > 600) {
                document.addEventListener('mousemove', (e) => {
                    glow.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, -50%)`;
                    glow.style.opacity = '0.65';
                });
                document.addEventListener('mouseleave', () => { glow.style.opacity = '0'; });
            }

            const container = document.getElementById('all-downloads');
            const countSpan = document.getElementById('download-count');

            async function loadDownloads() {
                try {
                    const resp = await fetch('download.json');
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    const downloads = await resp.json();
                    if (!downloads || downloads.length === 0) {
                        container.innerHTML = '<div class="error-message">🔌 仓库暂时为空</div>';
                        return;
                    }
                    countSpan.textContent = downloads.length;
                    container.innerHTML = '';

                    for (let idx = 0; idx < downloads.length; idx++) {
                        const item = downloads[idx];
                        const card = document.createElement('div');
                        card.className = 'download-card';
                        card.style.setProperty('--order', idx);
                        card.innerHTML = `
                            <i class="fas ${escapeAttr(item.icon) || 'fa-file'} file-icon"></i>
                            <div class="file-name">${escapeHtml(item.name) || escapeHtml(item.filename)}</div>
                            <div class="file-meta"><span><i class="fas fa-database"></i> ${escapeHtml(item.size) || '?'}</span><span><i class="fas fa-shield-alt"></i> 下载</span></div>
                            <p style="margin-bottom:1.5rem; color:#b0e0ff; font-size:0.95rem;">${escapeHtml(item.description) || '一个神秘的文件'}</p>
                            <a class="download-btn" href="Files/${item.filename}" download><i class="fas fa-download"></i> 获取文件</a>
                        `;
                        container.appendChild(card);
                    }
                } catch (err) {
                    container.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-triangle"></i> 量子仓库连接失败: ${err.message}</div>`;
                }
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }
            function escapeAttr(str) {
                if (!str) return '';
                return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
            }

            loadDownloads();
        })();
    </script>
</body>
</html>
